<!doctype html>
<meta charset="utf-8">
<title>AI 챗봇</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
         margin: 2rem auto; max-width: 46rem; }
  .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .bar input { padding: .4rem; font-family: ui-monospace, monospace; }
  #log { border: 1px solid #ddd; padding: 1rem; min-height: 18rem;
         max-height: 26rem; overflow-y: auto; background: #fafafa; }
  .turn { margin-bottom: 1rem; white-space: pre-wrap; line-height: 1.5; }
  .who { font-size: .75rem; color: #888; display: block; margin-bottom: .2rem; }
  .me .who { color: #06c; }
  .sys { color: #a00; font-size: .85rem; }
  .ask { display: flex; gap: .5rem; margin-top: 1rem; }
  .ask input { flex: 1; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; }
  small { color: #666; }
</style>

<h2>AI 챗봇</h2>
<p><small>
  같은 <b>세션</b>으로 이어서 물으면 앞의 대화를 기억한다.
  세션을 바꾸면 서로를 모른다 — 그게 이 실습의 핵심이다.
</small></p>

<div class="bar">
  <label>세션</label>
  <input id="sid" value="s1" size="10">
  <button onclick="newSession()">새 세션</button>
  <button onclick="clearLog()">화면 지우기</button>
  <span style="flex:1"></span>
  <small id="quota"></small>
</div>

<div id="log"></div>

<div class="ask">
  <input id="msg" placeholder="물어본다" onkeydown="if(event.key==='Enter') send()">
  <button id="sendBtn" onclick="send()">보내기</button>
  <button id="stopBtn" onclick="stop()" disabled>중단</button>
</div>
<p><small>
  <b>중단</b>을 눌러 보면 서버 로그에 <code>응답 취소</code> 가 찍힌다.
  이게 없으면 사용자가 떠난 뒤에도 모델 호출이 계속 흐르고, 비용도 계속 나간다.
</small></p>

<script>
const log = document.getElementById('log');
const sid = document.getElementById('sid');
const msg = document.getElementById('msg');
const quota = document.getElementById('quota');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');

let controller = null;

function bubble(who, cls) {
  const div = document.createElement('div');
  div.className = 'turn ' + (cls || '');
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who;
  div.appendChild(label);
  const body = document.createElement('span');
  div.appendChild(body);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}

function newSession() {
  sid.value = 's' + Math.floor(Math.random() * 10000);
  bubble('— 세션을 ' + sid.value + ' 로 바꿨다. 여기서부터는 앞의 대화를 모른다 —', 'sys');
}

function clearLog() { log.textContent = ''; }

async function refreshQuota() {
  try { quota.textContent = await (await fetch('/api/chat/ping')).text(); }
  catch { quota.textContent = ''; }
}

function stop() {
  if (controller) controller.abort();
}

async function send() {
  const text = msg.value.trim();
  if (!text) return;

  bubble('나 · ' + sid.value, 'me').textContent = text;
  msg.value = '';
  sendBtn.disabled = true;
  stopBtn.disabled = false;
  controller = new AbortController();

  const out = bubble('챗봇');

  try {
    const r = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sid.value, message: text }),
      signal: controller.signal
    });

    // 400·429 는 SSE 가 아니라 JSON 으로 온다.
    // 스트림이 시작되기 "전에" 막힌 실패라서 상태 코드를 쓸 수 있었다는 뜻이다.
    if (!r.ok) {
      const body = await r.json().catch(() => ({ message: r.statusText }));
      out.parentElement.className = 'turn sys';
      out.textContent = 'HTTP ' + r.status + ' — ' + body.message;
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';        // 아직 줄바꿈을 못 만난 나머지
    let ev = 'message';  // 지금 읽고 있는 이벤트 종류

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      // stream:true — 한글은 3바이트라 조각 경계에서 잘릴 수 있다.
      // 이 옵션이 없으면 잘린 글자가 U+FFFD 로 깨진다.
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();   // 마지막 줄은 아직 안 끝났을 수 있으므로 남겨 둔다
      for (const line of lines) {
        if (line.startsWith('event:')) {
          ev = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          const data = line.slice(5);
          if (ev === 'message') {
            out.textContent += data;
            log.scrollTop = log.scrollHeight;
          } else if (ev === 'error') {
            // 스트림이 이미 시작된 뒤의 실패. 상태 코드는 200 이었다.
            out.parentElement.className = 'turn sys';
            out.textContent += '\n[오류] ' + data;
          }
          // done 은 따로 그리지 않는다. 끊긴 것과 구분되는 것만으로 충분하다.
        }
      }
    }
  } catch (e) {
    out.parentElement.className = 'turn sys';
    out.textContent += (e.name === 'AbortError')
      ? '\n[중단됨] 서버 로그에 "응답 취소" 가 찍혔는지 본다'
      : '\n[연결 오류] ' + e.message;
  } finally {
    sendBtn.disabled = false;
    stopBtn.disabled = true;
    controller = null;
    refreshQuota();
    msg.focus();
  }
}

refreshQuota();
msg.focus();
</script>
