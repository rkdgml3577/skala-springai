<!doctype html>
<meta charset="utf-8">
<title>AI 챗봇</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
         margin: 2rem auto; max-width: 46rem; }
  .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .bar input { padding: .4rem; font-family: ui-monospace, monospace; }
  #log { border: 1px solid #ddd; padding: 1rem; min-height: 18rem;
         max-height: 26rem; overflow-y: auto; background: #fafafa; }
  .turn { margin-bottom: 1rem; white-space: pre-wrap; line-height: 1.5; }
  .who { font-size: .75rem; color: #888; display: block; margin-bottom: .2rem; }
  .me .who { color: #06c; }
  .sys { color: #a00; font-size: .85rem; }
  .ask { display: flex; gap: .5rem; margin-top: 1rem; }
  .ask input { flex: 1; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; }
  small { color: #666; }
</style>

<h2>AI 챗봇</h2>
<p><small>
  같은 <b>세션</b>으로 이어서 물으면 앞의 대화를 기억한다.
  세션을 바꾸면 서로를 모른다 — 그게 이 실습의 핵심이다.
</small></p>

<div class="bar">
  <label>사용자</label>
  <input id="user" value="alice" size="6">
  <input id="pw" type="password" value="alice-pw" size="9">
  <label>세션</label>
  <input id="sid" value="s1" size="10">
  <button onclick="newSession()">새 세션</button>
  <button onclick="loadHistory()">이력 불러오기</button>
  <button onclick="deleteSession()">세션 지우기</button>
  <button onclick="listSessions()">세션 목록</button>
  <span style="flex:1"></span>
  <small id="quota"></small>
</div>

<div id="log"></div>

<div class="ask">
  <input id="msg" placeholder="물어본다" onkeydown="onEnter(event)">
  <button id="sendBtn" onclick="send()">보내기</button>
  <button id="stopBtn" onclick="stop()" disabled>중단</button>
</div>
<p><small>
  <b>중단</b>을 눌러 보면 서버 로그에 <code>응답 취소</code> 가 찍힌다.
  이게 없으면 사용자가 떠난 뒤에도 모델 호출이 계속 흐르고, 비용도 계속 나간다.
</small></p>

<script>
const log = document.getElementById('log');
const sid = document.getElementById('sid');
const msg = document.getElementById('msg');
const quota = document.getElementById('quota');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');

let controller = null;

/**
 * 한글은 마지막 글자가 아직 "조합 중" 인 상태로 입력창에 보인다.
 * 그때 Enter 를 누르면 keydown 이 먼저 오고 조합 확정이 나중에 온다 —
 * send() 가 입력창을 비운 뒤에 마지막 글자가 다시 들어와서, 다음 Enter 때 한 번 더 나간다.
 * 영어로 치면 조합 단계가 없어서 이 문제가 안 보인다.
 *
 * isComposing 이 표준이고, keyCode 229 는 그것을 안 주는 옛 브라우저용 보험이다.
 */
function onEnter(event) {
  if (event.key !== 'Enter') return;
  if (event.isComposing || event.keyCode === 229) return;   // 아직 조합 중이다
  send();
}

// HTTP Basic — fetch 는 401 을 받아도 브라우저 인증창을 띄우지 않는다.
// 그래서 헤더를 직접 만들어 실어 보낸다.
// btoa 는 라틴 문자만 다루므로 한글 비밀번호는 여기서 깨진다 (실습용이라 그대로 둔다).
function authHeaders(extra) {
  const token = btoa(document.getElementById('user').value + ':' +
                     document.getElementById('pw').value);
  return Object.assign({ 'Authorization': 'Basic ' + token }, extra || {});
}

function bubble(who, cls) {
  const div = document.createElement('div');
  div.className = 'turn ' + (cls || '');
  const label = document.createElement('span');
  label.className = 'who';
  label.textContent = who;
  div.appendChild(label);
  const body = document.createElement('span');
  div.appendChild(body);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}

function newSession() {
  sid.value = 's' + Math.floor(Math.random() * 10000);
  bubble('— 세션을 ' + sid.value + ' 로 바꿨다. 여기서부터는 앞의 대화를 모른다 —', 'sys');
}

function clearLog() { log.textContent = ''; }

// ── 이력 조회 ───────────────────────────────────────────────
// 모델을 부르지 않는다. Redis 에 쌓인 것을 그대로 읽어 온다.
// 새로고침하거나 다른 브라우저로 들어와도 대화가 그대로 있는지는 이걸로 확인한다.
async function loadHistory() {
  const id = sid.value;
  const res = await fetch('/api/chat/sessions/' + encodeURIComponent(id), { headers: authHeaders() });
  if (!res.ok) { bubble('— 인증 실패 (HTTP ' + res.status + ') —', 'sys'); return; }
  const rows = await res.json();
  clearLog();
  if (!rows.length) {
    bubble('— ' + id + ' 에 남아 있는 대화가 없다 —', 'sys');
    return;
  }
  for (const r of rows) {
    const isMe = r.role === 'user';
    bubble(isMe ? ('나 · ' + id) : '챗봇', isMe ? 'me' : '').textContent = r.text;
  }
}

async function listSessions() {
  const res = await fetch('/api/chat/sessions', { headers: authHeaders() });
  if (!res.ok) { bubble('— 인증 실패 (HTTP ' + res.status + ') —', 'sys'); return; }
  const rows = await res.json();
  const body = bubble('— 살아 있는 세션 —', 'sys');
  body.textContent = rows.length
    ? rows.map(r => `\n${r.sessionId}  (${r.messageCount}건)  ${r.lastMessage}`).join('')
    : ' 없음';
}

async function deleteSession() {
  const id = sid.value;
  await fetch('/api/chat/sessions/' + encodeURIComponent(id),
              { method: 'DELETE', headers: authHeaders() });
  bubble('— ' + id + ' 의 대화를 지웠다. 다음 질문부터는 처음 만난 사이가 된다 —', 'sys');
}

async function refreshQuota() {
  try { quota.textContent = await (await fetch('/api/chat/ping')).text(); }
  catch { quota.textContent = ''; }
}

function stop() {
  if (controller) controller.abort();
}

async function send() {
  const text = msg.value.trim();
  if (!text) return;

  bubble(document.getElementById('user').value + ' · ' + sid.value, 'me').textContent = text;
  msg.value = '';
  sendBtn.disabled = true;
  stopBtn.disabled = false;
  controller = new AbortController();

  const out = bubble('챗봇');

  try {
    const r = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ sessionId: sid.value, message: text }),
      signal: controller.signal
    });

    // 400·429 는 SSE 가 아니라 JSON 으로 온다.
    // 스트림이 시작되기 "전에" 막힌 실패라서 상태 코드를 쓸 수 있었다는 뜻이다.
    if (!r.ok) {
      const body = await r.json().catch(() => ({ message: r.statusText }));
      out.parentElement.className = 'turn sys';
      out.textContent = 'HTTP ' + r.status + ' — ' + body.message;
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';        // 아직 줄바꿈을 못 만난 나머지
    let ev = 'message';  // 지금 읽고 있는 이벤트 종류

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      // stream:true — 한글은 3바이트라 조각 경계에서 잘릴 수 있다.
      // 이 옵션이 없으면 잘린 글자가 U+FFFD 로 깨진다.
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();   // 마지막 줄은 아직 안 끝났을 수 있으므로 남겨 둔다
      for (const line of lines) {
        if (line.startsWith('event:')) {
          ev = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          const data = line.slice(5);
          if (ev === 'message') {
            out.textContent += data;
            log.scrollTop = log.scrollHeight;
          } else if (ev === 'error') {
            // 스트림이 이미 시작된 뒤의 실패. 상태 코드는 200 이었다.
            out.parentElement.className = 'turn sys';
            out.textContent += '\n[오류] ' + data;
          }
          // done 은 따로 그리지 않는다. 끊긴 것과 구분되는 것만으로 충분하다.
        }
      }
    }
  } catch (e) {
    out.parentElement.className = 'turn sys';
    out.textContent += (e.name === 'AbortError')
      ? '\n[중단됨] 서버 로그에 "응답 취소" 가 찍혔는지 본다'
      : '\n[연결 오류] ' + e.message;
  } finally {
    sendBtn.disabled = false;
    stopBtn.disabled = true;
    controller = null;
    refreshQuota();
    msg.focus();
  }
}

refreshQuota();
msg.focus();
</script>
