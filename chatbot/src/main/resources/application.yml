server:
  port: 8080

# ── 챗봇 동작을 정하는 설정. 자바 코드는 이 값을 모른다 ──────────────
app:
  provider: openai        # openai | ollama — 공급자를 바꾸는 유일한 자리
  temperature: 0.7        # 대화는 요약과 달리 조금 풀어 둔다
  max-messages: 20        # 한 세션이 기억하는 최근 메시지 수
  daily-quota: 20         # 사용자 1명이 하루에 쓸 수 있는 요청 수
  memory-ttl: 24h         # 방치된 세션이 Redis 에 영원히 쌓이지 않게 한다

spring:
  application:
    name: chatbot

  # 대화 이력을 둘 곳. 로컬에서 그냥 띄울 때는 docker compose up -d redis 로 먼저 켠다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s

  ai:
    # OpenAI — 키는 환경변수로만 받는다.
    # 기본값을 빈 문자열로 두면 안 된다. Spring AI 가 빈을 만들 때 바로 거절해서
    # 키가 없으면 애플리케이션 자체가 뜨지 않는다. 비어 있지 않은 값을 넣어 두면
    # 기동은 되고, 실제로 모델을 부를 때 401 로 실패한다 —
    # 그 실패는 ApiExceptionHandler 가 읽을 수 있는 메시지로 바꿔 준다.
    openai:
      api-key: ${OPENAI_API_KEY:키가-설정되지-않았다}
      chat:
        options:
          model: gpt-4o-mini
          # 스트리밍은 기본적으로 토큰 사용량을 안 보내 준다.
          # 켜면 마지막에 usage 만 담긴 조각을 하나 더 보내 준다.
          stream-usage: true
      connect-timeout: 10s
      read-timeout: 60s

    # Ollama — 키 없이 로컬에서 돈다. ollama pull qwen3.5:2b 를 먼저 해 둔다.
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3.5:2b

          # qwen3.5 는 답하기 전에 속으로 길게 생각하는 모델이다.
          # 그 생각은 content 가 아니라 thinking 으로 오기 때문에,
          # 생각하는 동안 화면에는 아무것도 나가지 않는다.
          # 같은 질문("안녕")으로 잰 값 — 첫 조각까지 true 55.6초 / false 3.5초.
          #
          #   true    추론을 다 한다. 느리지만 어려운 질문에 강하다   ← 지금 이 값
          #   low     짧게만 생각한다 — 절충안
          #   medium  중간
          #   high    더 길게 생각한다
          #   false   아예 끈다. 일반 대화라면 이쪽이 낫다
          #
          # 따옴표가 필요하다. 따옴표가 없으면 YAML 이 Boolean 으로 읽어 버리고,
          # 바인딩은 String 을 받는 ThinkOptionConverter 를 찾지 못한다.
          think-option: "true"

          # 대화가 쌓이면 프롬프트가 길어지므로 기본 4096 보다 넉넉히 둔다.
          num-ctx: 8192

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.example.chatbot: DEBUG

---
# ./gradlew bootRun --args='--spring.profiles.active=local'  → 키 없이 Ollama 로 실행
spring:
  config:
    activate:
      on-profile: local
app:
  provider: ollama
