<!doctype html>
<meta charset="utf-8">
<title>회의록 요약봇</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 2rem auto; max-width: 46rem; }
  textarea { width: 100%; height: 12rem; font-family: ui-monospace, monospace; font-size: .9rem; }
  button { padding: .5rem 1rem; margin-right: .5rem; }
  pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; min-height: 4rem; }
</style>
<h2>회의록 요약봇</h2>
<p>회의록을 붙여 넣고 버튼을 누른다. 스트리밍은 글자가 하나씩 늘어나는지 본다.</p>
<textarea id="src" placeholder="회의록을 붙여 넣는다"></textarea>
<p>
  <button onclick="run('summary')">요약</button>
  <button onclick="run('report')">정리(JSON)</button>
  <button onclick="stream()">스트리밍</button>
</p>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const src = document.getElementById('src');

async function run(kind) {
  out.textContent = '호출 중...';
  const r = await fetch('/api/minutes/' + kind, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text: src.value })
  });
  const t = await r.text();
  try { out.textContent = JSON.stringify(JSON.parse(t), null, 2); }
  catch { out.textContent = t; }
}

// SSE 는 GET 만 되므로 fetch 로 직접 읽는다
async function stream() {
  out.textContent = '';
  const r = await fetch('/api/minutes/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text: src.value })
  });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';        // 아직 줄바꿈을 못 만난 나머지
  let ev = 'message';  // 지금 읽고 있는 이벤트 종류
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    // stream:true — 한글은 3바이트라 조각 경계에서 잘릴 수 있다.
    // 이 옵션이 없으면 잘린 글자가 U+FFFD 로 깨진다.
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();   // 마지막 줄은 아직 안 끝났을 수 있으므로 남겨 둔다
    for (const line of lines) {
      if (line.startsWith('event:')) {
        ev = line.slice(6);
      } else if (line.startsWith('data:')) {
        const data = line.slice(5);
        if (ev === 'token') out.textContent += data;
        else if (ev === 'done') out.textContent += '\n\n— 완료 —';
        else if (ev === 'error') out.textContent += '\n\n— 오류: ' + data + ' —';
      }
    }
  }
}
</script>
